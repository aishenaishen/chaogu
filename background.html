<!doctype html>
<meta charset="utf-8">
<script type="module">
import OBR from "https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk@3/+esm";
import { MKT_KEY, clampSpeed, newMarket, stepMarket } from "./shared.js";

// SDK 必须静态 import：OBR 在 iframe 的 load 事件里才发 OBR_READY，
// 动态 import 会输掉这场竞速，onReady 永远不触发。

// 后台页做「兜底推进」：GM 开着面板时由 action.html 精确推进；
// 两者都遵守「到期才跳」，这里多让 1.2 秒，所以不会互相抢跳。
const GRACE_MS = 1200;

OBR.onReady(async () => {
  const role = await OBR.player.getRole();
  if (role !== "GM") return;   // 只有 GM 的浏览器推进，避免多人重复跳

  const md = await OBR.room.getMetadata();
  if (!md[MKT_KEY] || !md[MKT_KEY].stocks) {
    await OBR.room.setMetadata({ [MKT_KEY]: newMarket() });
  }

  // 和面板用同一条「到期才跳」规则，但多让 1.2 秒：
  // 面板开着时几乎总是面板先跳；面板关掉后，这里按速度接手。
  const GRACE_MS = 1200;

  async function loop() {
    try {
      const cur = (await OBR.room.getMetadata())[MKT_KEY];
      if (cur && cur.stocks && cur.running !== false) {
        const wait = clampSpeed(cur.speed);
        const stamp = cur.steppedAt || 0;
        if (Date.now() - stamp >= wait + GRACE_MS) {
          const next = stepMarket(cur);
          next.lastBy = "后台";
          await OBR.room.setMetadata({ [MKT_KEY]: next });
        }
      }
    } catch (e) { /* 下一轮再试 */ }
    setTimeout(loop, 1000);
  }
  loop();
});
</script>
