<!doctype html>
<meta charset="utf-8">
<script type="module">
import OBR from "https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk@3/+esm";
import { MKT_KEY, TICK_MS, clampSpeed, newMarket, stepMarket } from "./shared.js";

// SDK 必须静态 import：OBR 在 iframe 的 load 事件里才发 OBR_READY，
// 动态 import 会输掉这场竞速，onReady 永远不触发。

OBR.onReady(async () => {
  const role = await OBR.player.getRole();
  if (role !== "GM") return;   // 只让 GM 的浏览器推进行情，避免多人重复跳

  const md = await OBR.room.getMetadata();
  if (!md[MKT_KEY] || !md[MKT_KEY].stocks) {
    await OBR.room.setMetadata({ [MKT_KEY]: newMarket() });
  }

  // 每 1 秒查一次「该跳了吗」，而不是死等一个 setInterval：
  // GM 把 30 秒改成 1 秒时，最多 1 秒就生效。
  let elapsed = 0;
  async function loop() {
    let wait = TICK_MS;
    try {
      const cur = (await OBR.room.getMetadata())[MKT_KEY];
      if (cur) {
        wait = clampSpeed(cur.speed);
        if (cur.running !== false && cur.stocks) {
          elapsed += 1000;
          if (elapsed >= wait) {
            elapsed = 0;
            await OBR.room.setMetadata({ [MKT_KEY]: stepMarket(cur) });
          }
        }
      }
    } catch (e) { /* 下一轮再试 */ }
    setTimeout(loop, Math.min(1000, wait));
  }
  loop();
});
</script>
